<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05070f">
  <title>Une surprise pour toi</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --night: #05070f;
      --navy: #0b1430;
      --gold: #e3c06b;
      --gold-light: #f6dd96;
      --gold-dark: #a87a24;
      --ink: #1a1204;
      --text: #f5efe2;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { background: var(--night); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 75% 45% at 50% -8%, rgba(246, 221, 150, .22), transparent 70%),
        radial-gradient(ellipse 130% 70% at 50% 115%, #172660, transparent 65%),
        linear-gradient(var(--night), var(--navy));
      color: var(--text);
      font-family: var(--serif);
      font-size: 1.0625rem;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: clamp(2.5rem, 12vh, 7rem) 1rem 3rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 8.5vw, 2.75rem);
      font-weight: 600;
      line-height: 1.15;
      color: var(--gold-light);
      text-shadow: 0 0 28px rgba(227, 192, 107, .35);
      text-wrap: balance;
    }
    .subtitle {
      margin: .5rem 0 0;
      font-size: clamp(1.2rem, 5.2vw, 1.5rem);
    }

    .gift {
      --s: min(56vw, 13rem);
      position: relative;
      width: var(--s);
      height: var(--s);
      margin: 2rem auto;
      isolation: isolate;
    }
    .gift::before {
      content: "";
      position: absolute;
      inset: -25%;
      z-index: -1;
      background: radial-gradient(circle at 50% 60%, rgba(227, 192, 107, .28), transparent 62%);
      animation: halo 3s ease-in-out infinite alternate;
    }
    .gift.shake { animation: shake .55s ease-in-out; }

    .box, .lid {
      position: absolute;
      border: 1px solid rgba(246, 221, 150, .45);
      background:
        linear-gradient(90deg, transparent 43%, var(--gold-dark) 43%, var(--gold-light) 50%, var(--gold-dark) 57%, transparent 57%),
        linear-gradient(160deg, #24387a, #101b44 75%);
    }
    .box {
      left: 7%;
      right: 7%;
      bottom: 0;
      height: 62%;
      border-radius: 3px 3px 10px 10px;
      box-shadow: 0 1.5rem 2.5rem rgba(0, 0, 0, .55), inset 0 -1rem 1.5rem rgba(0, 0, 0, .35);
    }
    .box::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 70%;
      background: radial-gradient(ellipse 50% 100% at 50% 100%, rgba(255, 236, 180, .85), transparent);
      opacity: 0;
      transition: opacity .6s .15s;
    }
    .lid {
      left: 0;
      right: 0;
      top: 26%;
      height: 12%;
      z-index: 1;
      border-radius: 4px;
      box-shadow: 0 .4rem .8rem rgba(0, 0, 0, .45);
      transition: transform .9s cubic-bezier(.25, 1.4, .4, 1);
    }
    .lid::before, .lid::after {
      content: "";
      position: absolute;
      bottom: calc(100% - var(--s) * .03);
      width: calc(var(--s) * .22);
      height: calc(var(--s) * .15);
      border: calc(var(--s) * .035) solid var(--gold);
      border-radius: 50%;
    }
    .lid::before { right: 50%; transform: rotate(20deg); transform-origin: 100% 100%; }
    .lid::after { left: 50%; transform: rotate(-20deg); transform-origin: 0 100%; }
    .knot {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: calc(100% - var(--s) * .04);
      width: calc(var(--s) * .12);
      height: calc(var(--s) * .09);
      transform: translateX(-50%);
      border-radius: 35%;
      background: linear-gradient(var(--gold-light), var(--gold-dark));
      box-shadow: 0 2px 4px rgba(0, 0, 0, .35);
    }
    .open .lid { transform: translate(-14%, -130%) rotate(-16deg); }
    .open .box::after { opacity: 1; }

    .btn {
      display: block;
      width: 100%;
      max-width: 22rem;
      margin: 0 auto;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .btn:active { transform: translateY(1px); }

    .btn-primary {
      min-height: 3.5rem;
      padding: .9rem 1.5rem;
      border: 0;
      font-size: 1.25rem;
      color: var(--ink);
      background: linear-gradient(var(--gold-light), var(--gold) 60%, #c9962f);
      box-shadow: 0 0 0 0 rgba(227, 192, 107, 0), 0 .6rem 1.5rem rgba(227, 192, 107, .25);
      animation: glow 2.4s ease-in-out infinite alternate;
    }

    .btn-ghost {
      min-height: 3rem;
      max-width: 16rem;
      padding: .6rem 1.25rem;
      border: 1px solid var(--gold);
      font-size: 1rem;
      color: var(--gold-light);
      background: transparent;
    }
    @media (hover: hover) {
      .btn-primary:hover { filter: brightness(1.06); }
      .btn-ghost:hover { background: rgba(227, 192, 107, .1); }
    }

    .reveal > * { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
    .reveal > :nth-child(2) { animation-delay: .15s; }
    .reveal > :nth-child(3) { animation-delay: .9s; }
    .reveal > :nth-child(4) { animation-delay: 1.4s; }

    .eyebrow {
      margin: 0 0 .75rem;
      font-size: .85rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .reveal h2 {
      margin: 0 0 1.75rem;
      font-size: clamp(1.8rem, 8.4vw, 2.75rem);
      font-weight: 600;
      line-height: 1.2;
      text-shadow: 0 0 24px rgba(227, 192, 107, .25);
      text-wrap: balance;
    }
    .reveal h2:focus { outline: none; }
    .kind {
      display: block;
      margin-bottom: .5rem;
      font-size: clamp(1.15rem, 4.8vw, 1.35rem);
      font-style: italic;
      font-weight: 400;
      color: var(--gold-light);
    }
    .details {
      display: grid;
      gap: .75rem;
      max-width: 24rem;
      margin: 0 auto 2rem;
      padding: 1rem 0;
      border-block: 1px solid rgba(227, 192, 107, .35);
    }
    .details dt {
      font-size: .8rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .details dd { margin: 0; }
    .details dd::first-letter { text-transform: uppercase; }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes halo { to { opacity: .55; transform: scale(.92); } }
    @keyframes glow { to { box-shadow: 0 0 0 .5rem rgba(227, 192, 107, .12), 0 .6rem 2rem rgba(227, 192, 107, .4); } }
    @keyframes shake {
      20% { transform: rotate(-4deg) scale(1.02); }
      40% { transform: rotate(4deg) scale(1.04); }
      60% { transform: rotate(-3deg) scale(1.04); }
      80% { transform: rotate(2deg) scale(1.02); }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } }
    @keyframes fade { from { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal > * { animation: fade .6s both !important; }
    }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main>
    <h1 data-gift="greeting"></h1>
    <p class="subtitle">Tu as reçu un cadeau&nbsp;<span aria-hidden="true">🎁</span></p>

    <div class="gift" id="gift" aria-hidden="true">
      <div class="lid"><span class="knot"></span></div>
      <div class="box"></div>
    </div>

    <button class="btn btn-primary" id="open" type="button">Ouvrir mon cadeau</button>

    <section class="reveal" id="reveal" aria-labelledby="reveal-title" hidden>
      <p class="eyebrow">Ton cadeau</p>
      <h2 id="reveal-title" tabindex="-1">
        <span class="kind" data-gift="kind"></span>
        <span data-gift="concert"></span>
      </h2>
      <dl class="details">
        <div><dt>Lieu</dt><dd data-gift="venue"></dd></div>
        <div><dt>Date</dt><dd data-gift="date"></dd></div>
      </dl>
      <button class="btn btn-ghost" id="replay" type="button">Rejouer l’animation</button>
    </section>
  </main>

  <script>
    const GIFT = {
      greeting: 'Joyeux anniversaire !',
      kind: 'Une place de concert',
      concert: 'The Music of Hans Zimmer & Others',
      venue: 'Le Zornhoff, Monswiller',
      date: 'samedi 3 avril 2027 à 20h00',
    };

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const wait = ms => new Promise(resolve => setTimeout(resolve, reduceMotion.matches ? 0 : ms));

    const gift = document.getElementById('gift');
    const openButton = document.getElementById('open');
    const reveal = document.getElementById('reveal');
    const revealTitle = document.getElementById('reveal-title');

    // French typography: a non-breaking space keeps "?" or "!" from wrapping alone onto the next line.
    for (const el of document.querySelectorAll('[data-gift]')) {
      el.textContent = GIFT[el.dataset.gift].replace(/ ([?!:;])/g, ' $1');
    }

    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    const COLORS = ['#f6dd96', '#e3c06b', '#c9962f', '#fff3cf', '#a87a24'];
    const FRAME_MS = 1000 / 60;
    let pieces = [];
    let frame = 0;
    let last = 0;

    function fitCanvas() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function burst(x, y, angle, spread, count, power) {
      for (let i = 0; i < count; i++) {
        const a = angle + (Math.random() - 0.5) * spread;
        const v = power * (0.45 + Math.random() * 0.55);
        const size = 6 + Math.random() * 7;
        pieces.push({
          x,
          y,
          vx: Math.cos(a) * v,
          vy: Math.sin(a) * v,
          w: size,
          h: size * (0.4 + Math.random() * 0.5),
          rot: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.3,
          flip: Math.random() * Math.PI * 2,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
        });
      }
    }

    function tick(now) {
      const dt = last ? Math.min((now - last) / FRAME_MS, 3) : 1;
      last = now;
      const drag = 0.97 ** dt;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces = pieces.filter(p => p.y < innerHeight + 30);
      for (const p of pieces) {
        p.vx *= drag;
        p.vy = p.vy * drag + 0.22 * dt;
        p.flip += 0.12 * dt;
        p.rot += p.spin * dt;
        p.x += (p.vx + Math.sin(p.flip)) * dt;
        p.y += p.vy * dt;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, Math.cos(p.flip));
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (pieces.length) {
        frame = requestAnimationFrame(tick);
      } else {
        frame = 0;
        last = 0;
      }
    }

    function launchConfetti() {
      if (reduceMotion.matches) return;
      fitCanvas();
      const r = gift.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * 0.4, -Math.PI / 2, Math.PI * 0.7, 140, 17);
      burst(0, innerHeight, -Math.PI / 3, Math.PI / 5, 60, 26);
      burst(innerWidth, innerHeight, -Math.PI * 2 / 3, Math.PI / 5, 60, 26);
      if (!frame) frame = requestAnimationFrame(tick);
    }

    async function play() {
      openButton.hidden = true;
      reveal.hidden = true;
      gift.classList.add('shake');
      await wait(550);
      gift.classList.replace('shake', 'open');
      launchConfetti();
      await wait(700);
      reveal.hidden = false;
      revealTitle.focus({ preventScroll: true });
    }

    openButton.addEventListener('click', play);

    document.getElementById('replay').addEventListener('click', async () => {
      reveal.hidden = true;
      gift.classList.remove('open');
      await wait(900);
      play();
    });
  </script>
</body>
</html>
