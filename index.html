<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05070f">
  <meta name="color-scheme" content="dark">
  <title>Une surprise pour toi</title>
  <meta name="description" content="Clique pour découvrir ta surprise.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Une surprise pour toi">
  <meta property="og:description" content="Clique pour découvrir ta surprise.">
  <meta property="og:image" content="https://awurth.github.io/pour-toi/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Un coffret cadeau doré">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <style>
    @property --s {
      syntax: "<length>";
      inherits: true;
      initial-value: 0px;
    }

    :root {
      --night: #05070f;
      --navy: #0b1430;
      --gold: #e3c06b;
      --gold-light: #f6dd96;
      --gold-dark: #a87a24;
      --gold-metal: linear-gradient(180deg, #fff6d6 5%, #f2d58a 40%, #c99a3c 72%, #efcf86 100%);
      --ink: #1a1204;
      --text: #f5efe2;
      --text-muted: #d6cdb8;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { background: var(--night); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 70% 40% at 50% -6%, rgba(246, 221, 150, .2), transparent 70%),
        radial-gradient(ellipse 130% 60% at 50% 112%, rgba(38, 60, 150, .55), transparent 65%),
        radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, .5)),
        linear-gradient(var(--night), var(--navy));
      color: var(--text);
      font-family: var(--serif);
      font-size: 1.0625rem;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    body::before {
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, rgba(255, 240, 200, .9), transparent),
        radial-gradient(1px 1px at 68% 32%, rgba(255, 255, 255, .8), transparent),
        radial-gradient(2px 2px at 38% 74%, rgba(246, 221, 150, .8), transparent),
        radial-gradient(1px 1px at 86% 82%, rgba(255, 255, 255, .7), transparent),
        radial-gradient(1.5px 1.5px at 52% 52%, rgba(255, 240, 200, .6), transparent);
      background-size: 190px 210px, 250px 230px, 310px 290px, 170px 270px, 230px 190px;
      animation: stars 5s ease-in-out infinite alternate;
    }
    body::after {
      background:
        conic-gradient(from 147deg at 12% -4%, transparent, rgba(246, 221, 150, .09) 12deg, transparent 24deg),
        conic-gradient(from 189deg at 88% -4%, transparent, rgba(246, 221, 150, .09) 12deg, transparent 24deg);
      animation: beams 7s ease-in-out infinite alternate;
    }

    main, .locked {
      position: relative;
      z-index: 1;
    }

    .locked {
      margin: 0;
      padding: 42vh 1rem 0;
      text-align: center;
      font-style: italic;
      color: var(--text-muted);
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 34rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
      overflow-x: hidden;
      overflow-x: clip;
      text-align: center;
    }

    .metal {
      background: var(--gold-metal);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(227, 192, 107, .3));
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 8.5vw, 3rem);
      font-weight: 600;
      line-height: 1.15;
      text-wrap: balance;
    }
    .subtitle {
      margin: 0;
      font-size: clamp(1.15rem, 5vw, 1.45rem);
    }
    .gift-icon {
      vertical-align: -.12em;
      color: var(--gold);
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      margin: .75rem 0;
      line-height: 1;
      color: var(--gold);
    }
    .ornament::before,
    .ornament::after {
      content: "";
      flex: 0 1 4.5rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .ornament::after { background: linear-gradient(90deg, var(--gold), transparent); }

    .gift {
      --s: min(58vw, 14rem);
      position: relative;
      width: var(--s);
      height: var(--s);
      margin: 2.25rem auto 2.5rem;
      isolation: isolate;
      transition: --s .8s cubic-bezier(.2, .7, .2, 1), margin .8s cubic-bezier(.2, .7, .2, 1);
    }
    main:has(.reveal:not([hidden])) .gift {
      --s: min(32vw, 8.5rem);
      margin: 1rem auto 1.5rem;
    }
    .rays {
      position: absolute;
      left: -100%;
      top: -112%;
      width: 300%;
      height: 300%;
      z-index: -1;
      pointer-events: none;
      background: repeating-conic-gradient(rgba(246, 221, 150, .34) 0deg 6deg, transparent 6deg 18deg);
      -webkit-mask: radial-gradient(closest-side, #000 12%, transparent 80%);
      mask: radial-gradient(closest-side, #000 12%, transparent 80%);
      opacity: 0;
      scale: .3;
      transition: opacity .8s .15s, scale 1.2s cubic-bezier(.2, .7, .2, 1) .15s;
    }
    .open .rays {
      opacity: 1;
      scale: 1;
      animation: spin 50s linear infinite;
    }
    .gift::before {
      content: "";
      position: absolute;
      inset: -25%;
      z-index: -1;
      background: radial-gradient(circle at 50% 60%, rgba(227, 192, 107, .3), transparent 62%);
      animation: halo 3s ease-in-out infinite alternate;
    }
    .gift::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: -9%;
      height: 12%;
      z-index: -1;
      background: radial-gradient(closest-side, rgba(0, 0, 0, .7), transparent);
      animation: shadow 4s ease-in-out infinite;
    }
    .gift.shake { animation: shake .55s ease-in-out; }
    .gift-body {
      position: absolute;
      inset: 0;
      animation: float 4s ease-in-out infinite;
    }

    .spark {
      position: absolute;
      left: var(--x);
      top: var(--y);
      font-size: calc(var(--s) * var(--z));
      line-height: 1;
      color: var(--gold-light);
      text-shadow: 0 0 .5em rgba(246, 221, 150, .9);
      animation: twinkle 2.8s ease-in-out var(--d) infinite both;
    }

    .box, .lid {
      position: absolute;
      border: 1px solid rgba(246, 221, 150, .45);
      background:
        linear-gradient(90deg, transparent 43%, var(--gold-dark) 43%, var(--gold-light) 50%, var(--gold-dark) 57%, transparent 57%),
        radial-gradient(circle, rgba(246, 221, 150, .22) 1px, transparent 1.6px) 0 0 / 11px 11px,
        linear-gradient(160deg, #283f8a, #0f1a44 75%);
    }
    .box {
      left: 7%;
      right: 7%;
      bottom: 0;
      height: 62%;
      border-radius: 3px 3px 10px 10px;
      box-shadow:
        inset 14px 0 18px -12px rgba(255, 255, 255, .14),
        inset -18px 0 22px -12px rgba(0, 0, 0, .55),
        inset 0 -1rem 1.5rem rgba(0, 0, 0, .3),
        0 1rem 2rem rgba(0, 0, 0, .45);
    }
    .box::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 100%;
      height: 110%;
      background: radial-gradient(ellipse 45% 100% at 50% 100%, rgba(255, 236, 180, .9), rgba(246, 221, 150, .25) 55%, transparent);
      opacity: 0;
      transition: opacity .6s .15s;
    }
    .lid {
      left: 0;
      right: 0;
      top: 26%;
      height: 12%;
      z-index: 1;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 .4rem .8rem rgba(0, 0, 0, .45);
      transition: transform .9s cubic-bezier(.25, 1.4, .4, 1);
    }
    .lid::before, .lid::after {
      content: "";
      position: absolute;
      bottom: calc(100% - var(--s) * .03);
      width: calc(var(--s) * .22);
      height: calc(var(--s) * .15);
      border: calc(var(--s) * .035) solid var(--gold);
      border-radius: 50%;
    }
    .lid::before { right: 50%; transform: rotate(20deg); transform-origin: 100% 100%; }
    .lid::after { left: 50%; transform: rotate(-20deg); transform-origin: 0 100%; }
    .knot {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: calc(100% - var(--s) * .04);
      width: calc(var(--s) * .12);
      height: calc(var(--s) * .09);
      transform: translateX(-50%);
      border-radius: 35%;
      background: linear-gradient(var(--gold-light), var(--gold-dark));
      box-shadow: 0 2px 4px rgba(0, 0, 0, .35);
    }
    .knot::before, .knot::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 70%;
      width: 42%;
      height: 190%;
      background: linear-gradient(var(--gold), var(--gold-dark));
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
      transform-origin: top center;
    }
    .knot::before { left: 4%; transform: rotate(24deg); }
    .knot::after { right: 4%; transform: rotate(-24deg); }
    .open .lid { transform: translate(-14%, -130%) rotate(-16deg); }
    .open .box::after { opacity: 1; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 22rem;
      margin: 0 auto;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .btn:active { transform: translateY(1px); }

    .btn-primary {
      position: relative;
      overflow: hidden;
      min-height: 3.5rem;
      padding: .9rem 1.5rem;
      border: 0;
      font-size: 1.25rem;
      letter-spacing: .02em;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
      background: linear-gradient(#fbe7a9, var(--gold) 55%, #c18f2c);
      box-shadow: 0 0 0 0 rgba(227, 192, 107, 0), 0 .6rem 1.5rem rgba(227, 192, 107, .25);
      animation: glow 2.4s ease-in-out infinite alternate;
    }
    .btn-primary::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, .55) 50%, transparent 70%);
      transform: translateX(-120%);
      animation: sheen 3.5s ease-in-out 1s infinite;
    }

    .btn-ghost {
      gap: .5rem;
      min-height: 3rem;
      padding: .6rem .75rem;
      border: 1px solid var(--gold);
      font-size: 1rem;
      color: var(--gold-light);
      background: transparent;
    }
    .btn-ghost svg { flex: none; }
    .actions {
      display: flex;
      gap: .75rem;
      margin-top: 1.25rem;
      /* iOS WebKit clipped the buttons' bottom border at this box's edge; the padding keeps it clear. */
      padding-bottom: 3px;
    }
    .actions .btn {
      flex: 1 1 0;
      min-width: 0;
    }

    .replay {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      min-height: 2.75rem;
      margin-top: 1rem;
      padding: .5rem 1rem;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-size: .95rem;
      color: var(--gold);
      background: none;
      cursor: pointer;
      animation: rise .9s cubic-bezier(.2, .7, .2, 1) 1.7s backwards;
    }
    .replay:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    @media (hover: hover) {
      .btn-primary:hover { filter: brightness(1.06); }
      .btn-ghost:hover { background: rgba(227, 192, 107, .1); }
      .replay:hover { color: var(--gold-light); text-decoration: underline; text-underline-offset: .2em; }
    }

    .ticket {
      border-radius: 12px;
      box-shadow: 0 1rem 1.5rem rgba(0, 0, 0, .55);
      animation: card-in .8s cubic-bezier(.2, .7, .2, 1) backwards;
    }
    /* Each half paints its notched shape on pseudo-elements: a gold copy grown by 1px, edges out
       and notches in (::before), under the background (::after) draws the outline. A border can't
       follow the notches, and a
       drop-shadow outline on the wrapper only showed up on iOS once the child animations ended. */
    .ticket-main,
    .ticket-stub {
      position: relative;
      z-index: 0;
    }
    .ticket-main::before,
    .ticket-main::after,
    .ticket-stub::before,
    .ticket-stub::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .ticket-main::before,
    .ticket-stub::before {
      z-index: -2;
      background: rgba(240, 214, 150, .75);
    }
    .ticket-main::after,
    .ticket-stub::after { z-index: -1; }

    .ticket-main { padding: 1.5rem 1.25rem 1.4rem; }
    .ticket-main::before {
      inset: -1px -1px 0;
      border-radius: 13px 13px 0 0;
      -webkit-mask:
        radial-gradient(circle 13px at 1px 100%, transparent 98%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 13px at calc(100% - 1px) 100%, transparent 98%, #000) right / 51% 100% no-repeat;
      mask:
        radial-gradient(circle 13px at 1px 100%, transparent 98%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 13px at calc(100% - 1px) 100%, transparent 98%, #000) right / 51% 100% no-repeat;
    }
    .ticket-main::after {
      border-radius: 12px 12px 0 0;
      background: linear-gradient(160deg, rgba(32, 48, 108, .96), rgba(10, 16, 40, .96));
      -webkit-mask:
        radial-gradient(circle 14px at 0 100%, transparent 98%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 14px at 100% 100%, transparent 98%, #000) right / 51% 100% no-repeat;
      mask:
        radial-gradient(circle 14px at 0 100%, transparent 98%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 14px at 100% 100%, transparent 98%, #000) right / 51% 100% no-repeat;
    }

    .ticket-stub {
      padding: 1.25rem 1.25rem 1.1rem;
      color: var(--ink);
    }
    .ticket-stub::before {
      inset: 0 -1px -1px;
      border-radius: 0 0 13px 13px;
      -webkit-mask:
        radial-gradient(circle 13px at 1px 0, transparent 98%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 13px at calc(100% - 1px) 0, transparent 98%, #000) right / 51% 100% no-repeat;
      mask:
        radial-gradient(circle 13px at 1px 0, transparent 98%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 13px at calc(100% - 1px) 0, transparent 98%, #000) right / 51% 100% no-repeat;
    }
    .ticket-stub::after {
      border-radius: 0 0 12px 12px;
      background:
        radial-gradient(circle, rgba(5, 7, 15, .85) 1.3px, transparent 1.8px) 0 1px / 8px 6px repeat-x,
        linear-gradient(135deg, #f4e7c4, #e5cf98 50%, #cfb27c);
      -webkit-mask:
        radial-gradient(circle 14px at 0 0, transparent 98%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 14px at 100% 0, transparent 98%, #000) right / 51% 100% no-repeat;
      mask:
        radial-gradient(circle 14px at 0 0, transparent 98%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 14px at 100% 0, transparent 98%, #000) right / 51% 100% no-repeat;
    }
    .ticket-main > * { animation: rise .9s cubic-bezier(.2, .7, .2, 1) backwards; }
    .ticket-main > :nth-child(1) { animation-delay: .3s; }
    .ticket-main > :nth-child(2) { animation-delay: .9s; }
    .reveal > .eyebrow {
      margin: 0 0 .75rem;
      animation: rise .9s cubic-bezier(.2, .7, .2, 1) backwards;
    }
    .ticket-stub > * { animation: rise .9s cubic-bezier(.2, .7, .2, 1) 1.2s backwards; }
    .reveal > .actions { animation: rise .9s cubic-bezier(.2, .7, .2, 1) 1.45s backwards; }

    .eyebrow {
      margin: 0;
      white-space: nowrap;
      font-size: .8rem;
      letter-spacing: .3em;
      text-transform: uppercase;
    }
    .reveal h2 {
      margin: 0 0 .25rem;
      font-size: clamp(1.75rem, 8vw, 2.6rem);
      font-weight: 600;
      line-height: 1.2;
      text-wrap: balance;
    }
    .reveal h2:focus { outline: none; }
    .kind {
      display: block;
      margin-bottom: .4rem;
      font-size: clamp(1.1rem, 4.6vw, 1.3rem);
      font-style: italic;
      font-weight: 400;
    }
    .tagline {
      display: block;
      margin-top: .6rem;
      font-size: clamp(1rem, 4.4vw, 1.2rem);
      font-weight: 400;
      font-variant: small-caps;
      letter-spacing: .08em;
      color: var(--text-muted);
    }
    .note {
      margin: .6rem 0 0;
      font-size: clamp(1.15rem, 5vw, 1.35rem);
      font-style: italic;
      color: var(--gold-light);
    }
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin: 0;
    }
    .details > div { padding: 0 .5rem; }
    .details > div + div { border-left: 1px solid rgba(26, 18, 4, .3); }
    .details dt {
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #4a360b;
    }
    .details dd { margin: .2rem 0 0; font-size: 1.02rem; line-height: 1.3; }
    .details dd::first-letter { text-transform: uppercase; }
    .stamp {
      display: inline-block;
      margin: .9rem 0 0;
      padding: .2rem .7rem;
      border: 1.5px solid rgba(26, 18, 4, .7);
      border-radius: 4px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      rotate: -3deg;
    }

    .dust {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s;
    }
    .dust span {
      position: absolute;
      top: -12px;
      left: var(--x);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 6px 1px rgba(246, 221, 150, .7);
    }
    body:has(.reveal:not([hidden])) .dust { opacity: 1; }
    body:has(.reveal:not([hidden])) .dust span { animation: fall var(--t) linear var(--d) infinite both; }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes stars { from { opacity: .45; } }
    @keyframes spin { to { rotate: 360deg; } }
    @keyframes fall {
      0% { opacity: 0; transform: translate(0, 0); }
      10% { opacity: 1; }
      50% { transform: translate(var(--sway), 55vh); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translate(0, calc(100vh + 24px)); }
    }
    @keyframes beams { from { opacity: .5; } }
    @keyframes halo { to { opacity: .55; transform: scale(.92); } }
    @keyframes float { 50% { transform: translateY(-7px); } }
    @keyframes shadow { 50% { opacity: .65; transform: scaleX(.88); } }
    @keyframes twinkle {
      0%, 100% { opacity: .1; transform: scale(.5) rotate(0); }
      50% { opacity: 1; transform: scale(1) rotate(90deg); }
    }
    @keyframes glow { to { box-shadow: 0 0 0 .5rem rgba(227, 192, 107, .12), 0 .6rem 2rem rgba(227, 192, 107, .4); } }
    @keyframes sheen { 55%, 100% { transform: translateX(120%); } }
    @keyframes shake {
      20% { transform: rotate(-4deg) scale(1.02); }
      40% { transform: rotate(4deg) scale(1.04); }
      60% { transform: rotate(-3deg) scale(1.04); }
      80% { transform: rotate(2deg) scale(1.02); }
    }
    @keyframes card-in { from { opacity: 0; transform: translateY(18px) scale(.97); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes fade { from { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal, .reveal * { animation: fade .6s backwards !important; }
    }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="dust" id="dust" aria-hidden="true"></div>

  <p class="locked" id="locked" hidden>Ce lien est incomplet.</p>

  <main id="main" hidden>
    <h1 class="metal" data-gift="greeting"></h1>
    <p class="ornament" aria-hidden="true">✦</p>
    <p class="subtitle">Tu as reçu un cadeau&nbsp;<svg class="gift-icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="9" width="17" height="4" rx="1"/><path d="M5 13v7.5h14V13M12 9v11.5"/><path d="M12 9C10.5 6 7 5 6.5 7S9 9 12 9Zm0 0c1.5-3 5-4 5.5-2S15 9 12 9Z"/></svg></p>

    <div class="gift" id="gift" aria-hidden="true">
      <span class="rays"></span>
      <span class="spark" style="--x: -4%; --y: 6%; --z: .1; --d: 0s">✦</span>
      <span class="spark" style="--x: 92%; --y: 0%; --z: .07; --d: .9s">✦</span>
      <span class="spark" style="--x: -12%; --y: 58%; --z: .06; --d: 1.6s">✦</span>
      <span class="spark" style="--x: 104%; --y: 46%; --z: .09; --d: .4s">✦</span>
      <div class="gift-body">
        <div class="lid"><span class="knot"></span></div>
        <div class="box"></div>
      </div>
    </div>

    <button class="btn btn-primary" id="open" type="button">Ouvrir mon cadeau</button>

    <section class="reveal" id="reveal" aria-labelledby="reveal-title" hidden>
      <p class="ornament eyebrow">Ton cadeau</p>
      <div class="ticket">
        <div class="ticket-main">
          <h2 id="reveal-title" tabindex="-1">
            <span class="kind" data-gift="kind"></span>
            <span class="metal" data-gift="concert"></span>
            <span class="tagline" data-gift="tagline"></span>
          </h2>
          <p class="note" data-gift="note"></p>
        </div>
        <div class="ticket-stub">
          <dl class="details">
            <div><dt>Lieu</dt><dd data-gift="venue"></dd></div>
            <div><dt>Date</dt><dd data-gift="date"></dd></div>
          </dl>
          <p class="stamp">Bon pour une entrée</p>
        </div>
      </div>
      <div class="actions">
        <a class="btn btn-ghost" href="rendez-vous.ics" aria-label="Ajouter au calendrier">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          Calendrier
        </a>
        <a class="btn btn-ghost" id="map-link" target="_blank" rel="noreferrer" aria-label="Voir l’itinéraire (nouvel onglet)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
          Itinéraire
        </a>
      </div>
      <button class="replay" id="replay" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6L3.5 8.5"/><path d="M3.5 3.5v5h5"/></svg>
        Rejouer l’animation
      </button>
    </section>
  </main>

  <script>
    const GIFT = {
      greeting: 'Joyeux anniversaire, maman !',
      kind: 'Une place en Carré Or',
      concert: 'The Music of Hans Zimmer & Others',
      tagline: 'A Celebration of Film Music',
      note: 'On y va ensemble !',
      venue: 'Le Zornhoff, Monswiller',
      date: 'samedi 3 avril 2027 à 20 h',
    };

    // shortcut: hides the page from casual visitors only, the content stays readable in the source; encrypt GIFT if that ever matters.
    const ACCESS_TOKEN = '08eb163c7aed6058';
    const hasToken = new URLSearchParams(location.search).get('t') === ACCESS_TOKEN;
    document.getElementById(hasToken ? 'main' : 'locked').hidden = false;

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const wait = ms => new Promise(resolve => setTimeout(resolve, reduceMotion.matches ? 0 : ms));

    const main = document.getElementById('main');
    const gift = document.getElementById('gift');
    const openButton = document.getElementById('open');
    const reveal = document.getElementById('reveal');
    const revealTitle = document.getElementById('reveal-title');

    const DUST_COUNT = 14;
    for (let i = 0; i < DUST_COUNT; i++) {
      const speck = document.createElement('span');
      speck.style.cssText = `--x: ${(i + Math.random()) * 100 / DUST_COUNT}%; --size: ${2 + Math.random() * 2.5}px;`
        + ` --t: ${9 + Math.random() * 6}s; --d: ${Math.random() * 8}s; --sway: ${(Math.random() - 0.5) * 36}px`;
      document.getElementById('dust').append(speck);
    }

    // French typography: a non-breaking space keeps "?" or "!" from wrapping alone onto the next line.
    for (const el of document.querySelectorAll('[data-gift]')) {
      el.textContent = GIFT[el.dataset.gift].replace(/ ([?!:;])/g, ' $1');
    }

    document.getElementById('map-link').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(GIFT.venue)}`;

    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    const COLORS = ['#f6dd96', '#e3c06b', '#c9962f', '#fff3cf', '#a87a24', '#fffaf0'];
    const FRAME_MS = 1000 / 60;
    let pieces = [];
    let frame = 0;
    let last = 0;

    function fitCanvas() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function burst(x, y, angle, spread, count, power) {
      for (let i = 0; i < count; i++) {
        const a = angle + (Math.random() - 0.5) * spread;
        const v = power * (0.45 + Math.random() * 0.55);
        const size = 6 + Math.random() * 7;
        pieces.push({
          x,
          y,
          vx: Math.cos(a) * v,
          vy: Math.sin(a) * v,
          w: size,
          h: size * (0.4 + Math.random() * 0.5),
          round: Math.random() < 0.3,
          rot: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.3,
          flip: Math.random() * Math.PI * 2,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
        });
      }
    }

    function tick(now) {
      const dt = last ? Math.min((now - last) / FRAME_MS, 3) : 1;
      last = now;
      const drag = 0.97 ** dt;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces = pieces.filter(p => p.y < innerHeight + 30);
      for (const p of pieces) {
        p.vx *= drag;
        p.vy = p.vy * drag + 0.22 * dt;
        p.flip += 0.12 * dt;
        p.rot += p.spin * dt;
        p.x += (p.vx + Math.sin(p.flip)) * dt;
        p.y += p.vy * dt;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, Math.cos(p.flip));
        ctx.fillStyle = p.color;
        if (p.round) {
          ctx.beginPath();
          ctx.arc(0, 0, p.h / 2 + 1, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        ctx.restore();
      }
      if (pieces.length) {
        frame = requestAnimationFrame(tick);
      } else {
        frame = 0;
        last = 0;
      }
    }

    function launchConfetti() {
      if (reduceMotion.matches) return;
      fitCanvas();
      const r = gift.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * 0.4, -Math.PI / 2, Math.PI * 0.7, 140, 17);
      burst(0, innerHeight, -Math.PI / 3, Math.PI / 5, 60, 26);
      burst(innerWidth, innerHeight, -Math.PI * 2 / 3, Math.PI / 5, 60, 26);
      if (!frame) frame = requestAnimationFrame(tick);
    }

    // The page is vertically centred, so showing or hiding a block moves the gift: slide it to its new place instead of jumping.
    function shift(change) {
      const before = gift.getBoundingClientRect().top;
      change();
      const delta = before - gift.getBoundingClientRect().top;
      if (delta && !reduceMotion.matches) {
        main.animate(
          [{ transform: `translateY(${delta}px)` }, { transform: 'none' }],
          { duration: 700, easing: 'cubic-bezier(.2, .7, .2, 1)' },
        );
      }
    }

    async function play() {
      shift(() => {
        openButton.hidden = true;
        reveal.hidden = true;
      });
      gift.classList.add('shake');
      await wait(550);
      gift.classList.replace('shake', 'open');
      launchConfetti();
      await wait(700);
      shift(() => { reveal.hidden = false; });
      revealTitle.focus({ preventScroll: true });
    }

    openButton.addEventListener('click', play);

    document.getElementById('replay').addEventListener('click', async () => {
      shift(() => { reveal.hidden = true; });
      gift.classList.remove('open');
      await wait(900);
      play();
    });
  </script>
</body>
</html>
